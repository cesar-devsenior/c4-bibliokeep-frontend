<section class="space-y-8">
  <!-- Header -->
  <div class="space-y-2">
    <h1 class="text-4xl font-bold text-slate-900 dark:text-white">Dashboard</h1>
    <p class="text-slate-600 dark:text-slate-300">Resumen de tu aktividad de lectura</p>
  </div>

  <!-- Stats Grid -->
  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
    <!-- Total Books Card -->
    <div class="group rounded-xl bg-gradient-to-br from-blue-500 to-blue-600 p-6 shadow-lg transition-all hover:shadow-xl hover:-translate-y-1">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-blue-100">Total de libros</p>
          <p class="mt-2 text-4xl font-bold text-white">24</p>
        </div>
        <span class="text-5xl opacity-20">📚</span>
      </div>
    </div>

    <!-- Read Books Card -->
    <div class="group rounded-xl bg-gradient-to-br from-green-500 to-emerald-600 p-6 shadow-lg transition-all hover:shadow-xl hover:-translate-y-1">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-green-100">Libros leídos</p>
          <p class="mt-2 text-4xl font-bold text-white">12</p>
        </div>
        <span class="text-5xl opacity-20">✅</span>
      </div>
    </div>

    <!-- Currently Reading Card -->
    <div class="group rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 p-6 shadow-lg transition-all hover:shadow-xl hover:-translate-y-1">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-amber-100">En lectura</p>
          <p class="mt-2 text-4xl font-bold text-white">3</p>
        </div>
        <span class="text-5xl opacity-20">👀</span>
      </div>
    </div>

    <!-- Wishlist Card -->
    <div class="group rounded-xl bg-gradient-to-br from-pink-500 to-rose-600 p-6 shadow-lg transition-all hover:shadow-xl hover:-translate-y-1">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-pink-100">En la lista</p>
          <p class="mt-2 text-4xl font-bold text-white">9</p>
        </div>
        <span class="text-5xl opacity-20">❤️</span>
      </div>
    </div>
  </div>

  <!-- Charts Section Placeholder -->
  <div class="rounded-xl bg-white p-8 shadow-md dark:bg-slate-800">
    <h2 class="mb-6 text-xl font-bold text-slate-900 dark:text-white">Tus hábitos de lectura</h2>
    <div class="h-64 flex items-center justify-center rounded-lg bg-gradient-to-br from-slate-50 to-slate-100 dark:from-slate-700 dark:to-slate-600">
      <div class="text-center">
        <p class="text-3xl">📈</p>
        <p class="mt-2 text-slate-600 dark:text-slate-300">Los gráficos aparecerán aquí</p>
      </div>
    </div>
  </div>

  <!-- Recent Activity -->
  <div class="rounded-xl bg-white p-8 shadow-md dark:bg-slate-800">
    <h2 class="mb-6 text-xl font-bold text-slate-900 dark:text-white">Actividad reciente</h2>
    <div class="space-y-4">
      <div class="flex items-center gap-4 border-l-4 border-amber-400 bg-amber-50 p-4 rounded dark:border-amber-500 dark:bg-amber-900/20">
        <span class="text-2xl">📖</span>
        <div class="flex-1">
          <p class="font-semibold text-slate-900 dark:text-white">Completaste "El Quijote"</p>
          <p class="text-sm text-slate-600 dark:text-slate-400">hace 2 días</p>
        </div>
      </div>
      <div class="flex items-center gap-4 border-l-4 border-blue-400 bg-blue-50 p-4 rounded dark:border-blue-500 dark:bg-blue-900/20">
        <span class="text-2xl">➕</span>
        <div class="flex-1">
          <p class="font-semibold text-slate-900 dark:text-white">Agregaste "Cien años de soledad"</p>
          <p class="text-sm text-slate-600 dark:text-slate-400">hace 5 días</p>
        </div>
      </div>
    </div>
  </div>
</section>
