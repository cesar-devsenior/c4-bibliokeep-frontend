<div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 px-4 py-12 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-8">
    <!-- Header -->
    <div class="text-center">
      <div class="mb-4 flex justify-center">
        <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 shadow-2xl">
          <span class="text-3xl">📚</span>
        </div>
      </div>
      <h1 class="text-3xl font-bold text-white">BiblioKeep</h1>
      <p class="mt-2 text-slate-300">Crea tu cuenta para comenzar</p>
    </div>

    <!-- Form Card -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-6 rounded-2xl bg-slate-800/50 backdrop-blur-sm border border-slate-700 p-8 shadow-2xl">
      <!-- Email Field -->
      <div class="space-y-2">
        <label for="email" class="block text-sm font-semibold text-white">Correo electrónico</label>
        <input
          id="email"
          formControlName="email"
          type="email"
          required
          class="w-full rounded-lg border border-slate-600 bg-slate-700/50 px-4 py-3 text-white placeholder-slate-400 transition-all focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-400/20"
          placeholder="tu@email.com"
        />
      </div>

      <!-- Password Field -->
      <div class="space-y-2">
        <label for="password" class="block text-sm font-semibold text-white">Contraseña</label>
        <input
          id="password"
          formControlName="password"
          type="password"
          required
          class="w-full rounded-lg border border-slate-600 bg-slate-700/50 px-4 py-3 text-white placeholder-slate-400 transition-all focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-400/20"
          placeholder="••••••••"
        />
      </div>

      <!-- Preferences Field -->
      <div class="space-y-2">
        <label for="preferences" class="block text-sm font-semibold text-white">Géneros favoritos <span class="text-slate-400">(opcional, separados por comas)</span></label>
        <input
          id="preferences"
          formControlName="preferences"
          type="text"
          class="w-full rounded-lg border border-slate-600 bg-slate-700/50 px-4 py-3 text-white placeholder-slate-400 transition-all focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-400/20"
          placeholder="Ficción, Ciencia Ficción, Misterio..."
        />
      </div>

      <!-- Annual Goal Field -->
      <div class="space-y-2">
        <label for="goal" class="block text-sm font-semibold text-white">Meta anual</label>
        <input
          id="goal"
          formControlName="annualGoal"
          type="number"
          class="w-full rounded-lg border border-slate-600 bg-slate-700/50 px-4 py-3 text-white placeholder-slate-400 transition-all focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-400/20"
          placeholder="12"
        />
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="form.invalid"
        class="w-full rounded-lg bg-gradient-to-r from-green-500 to-emerald-500 px-4 py-3 font-semibold text-white shadow-lg transition-all hover:shadow-xl hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Crear cuenta
      </button>
    </form>

    <!-- Footer -->
    <p class="text-center text-slate-400">
      ¿Ya tienes cuenta?
      <a routerLink="/auth/login" class="font-semibold text-amber-400 hover:text-amber-300">Inicia sesión aquí</a>
    </p>
  </div>
</div>
